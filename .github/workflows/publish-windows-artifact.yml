---
name: publish-windows-artifact
'on':
  push:
    branches:
      - custom/headless-r01-r16
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing Windows artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh run download 43232602807 --repo "$GITHUB_REPOSITORY" \
            --name "lmms-1.3.0-alpha.2.2+39b13bf-mingw-win64.exe" --dir dist
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view custom-win64-39b13bf --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create custom-win64-39b13bf --repo "$GITHUB_REPOSITORY" \
              --title "LMMS 1.3 custom Windows x64 (39b13bf)" \
              --notes "Self-compiled MinGW-w64 x64 build with headless customizations R01-R16."
          gh release upload custom-win64-39b13bf dist/* --clobber --repo "$GITHUB_REPOSITORY"
